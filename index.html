<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A thoughtful Wordle solver that ranks the best next guess by information gain."
    />
    <meta name="theme-color" content="#101210" />
    <link rel="icon" href="/wordle_solver/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/wordle_solver/manifest.json" />
    <title>Wordle Solver — Find your next guess</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("wordle-solver-theme");
          const theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#101210" : "#f5f7f4";
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <script type="module" crossorigin src="/wordle_solver/assets/index-BwSPFI4M.js"></script>
    <link rel="stylesheet" crossorigin href="/wordle_solver/assets/index-Bphx2dT0.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
